name: Build installers

# Push a tag like v1.1.1 (matching "version" in package.json) to build the Windows installer and the
# Linux .deb / .AppImage, test them, and publish them together as a GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Build the installer
        run: npm run dist

      # Install on a clean Windows machine with a pretend task file, and make sure
      # installing, reinstalling and uninstalling never remove or change it.
      - name: Test install keeps your tasks safe
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist -Filter 'Tack-Setup-*.exe').FullName
          $data = "$env:APPDATA\Tack"
          New-Item -ItemType Directory -Force $data | Out-Null
          '{"tack.tasks":[{"uuid":"test","description":"keep me","status":"pending","entry":0,"tags":[],"annotations":[],"depends":[]}]}' | Set-Content "$data\store.json" -NoNewline
          $before = Get-FileHash "$data\store.json"

          Start-Process $setup -ArgumentList '/S' -Wait
          $exe = "$env:LOCALAPPDATA\Programs\Tack\Tack.exe"
          if (-not (Test-Path $exe)) { throw "Tack.exe was not installed at $exe" }
          Start-Process $setup -ArgumentList '/S' -Wait   # reinstall = update
          if ((Get-FileHash "$data\store.json").Hash -ne $before.Hash) { throw 'store.json changed during install' }
          if (-not (Get-ChildItem "$data\backups" -Filter 'before-update-*.json')) { throw 'no backup was made before installing' }

          $uninstaller = Get-ChildItem "$env:LOCALAPPDATA\Programs\Tack" -Filter 'Uninstall*.exe' | Select-Object -First 1
          Start-Process $uninstaller.FullName -ArgumentList '/S' -Wait
          Start-Sleep 5
          if ((Get-FileHash "$data\store.json").Hash -ne $before.Hash) { throw 'store.json was removed or changed by uninstall' }
          Write-Host 'Install, update and uninstall all kept the task file intact.'

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/Tack-Setup-*.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Build the .deb and .AppImage
        run: npm run dist:linux

      # Install the .deb on a clean Ubuntu machine, start Tack on a virtual screen with a pretend
      # task file, and check it opens, loads the task and leaves the file intact. Same for the AppImage.
      - name: Test Tack starts and loads tasks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          sudo apt-get install -y ./dist/Tack-*.deb
          test -x /opt/Tack/tack
          task='{"tack.tasks":[{"uuid":"t1","description":"keep me","status":"pending","entry":0,"tags":[],"annotations":[],"depends":[]}]}'

          data=$(mktemp -d); echo "$task" > "$data/store.json"
          TACK_DATA="$data" timeout 30 xvfb-run -a /opt/Tack/tack || true
          echo "--- .deb log"; cat "$data/tack.log"
          grep -q "page connected, 1 tasks" "$data/tack.log"
          grep -q '"keep me"' "$data/store.json"

          data2=$(mktemp -d); echo "$task" > "$data2/store.json"
          chmod +x dist/Tack-*.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 TACK_DATA="$data2" timeout 30 xvfb-run -a ./dist/Tack-*.AppImage --no-sandbox || true
          echo "--- AppImage log"; cat "$data2/tack.log"
          grep -q "page connected, 1 tasks" "$data2/tack.log"
          grep -q '"keep me"' "$data2/store.json"
          echo 'The .deb and the AppImage both started, loaded the task and kept the file intact.'

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/Tack-*.deb
            dist/Tack-*.AppImage

  release:
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          gh release create "${{ github.ref_name }}" out/* --repo "${{ github.repository }}" --title "Tack ${{ github.ref_name }}" --notes "$(cat <<'EOF'
          **Windows:** download `Tack-Setup-*.exe` and run it.

          **Linux (Ubuntu, Debian, Mint, Pop!_OS):** download the `.deb` and open it, or run `sudo apt install ./Tack-*.deb`.
          **Other Linux:** download the `.AppImage`, make it executable (`chmod +x Tack-*.AppImage`) and run it.

          Your tasks are kept safe across updates.
          EOF
          )"
